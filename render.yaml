services:
  - type: web
    name: muddo-agro-chemicals
    env: python
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py check --fail-level ERROR &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py seed_data
    startCommand: gunicorn muddo_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MAIL_PASSWORD
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: GOOGLE_MAPS_KEY
        sync: false
      - key: WHATSAPP_NUMBER
        value: "256772507582"
      # ── Optional: set these to move uploaded media (product photos,
      # chat attachments, staff/agent avatars) onto S3 so they survive
      # restarts/redeploys, instead of Render's ephemeral local disk.
      # Leave unset and everything keeps working exactly as before —
      # uploads just won't persist across a restart until these are set.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
    plan: free
